<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <!--seo-->
    <title>PaperTik · TikTok-style feed of computer science papers</title>
    <meta
      name="description"
      content="Swipe through computer science research papers one abstract at a time. Like what you'd read and the feed learns your taste. Free, no sign-up."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PaperTik" />
    <meta property="og:title" content="PaperTik · TikTok-style feed of computer science papers" />
    <meta
      property="og:description"
      content="Swipe through computer science papers. Like what you'd read and the feed learns your taste."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PaperTik · TikTok-style feed of computer science papers" />
    <meta name="twitter:description" content="Swipe through computer science papers. Like what you'd read and the feed learns your taste." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PaperTik",
        "description": "A TikTok-style feed of computer science research papers that learns what you like.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0" },
        "sameAs": ["https://github.com/hgminh95/papertok"]
      }
    </script>
    <!--/seo-->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* Before the app boots (and for crawlers): a readable page instead of a blank one. */
      html { background: #0b0b0f; color: #f5f5f7; font-family: ui-sans-serif, system-ui, sans-serif; }
      .seo { max-width: 640px; margin: 48px auto; padding: 0 16px; line-height: 1.6; }
      .seo a { color: #f5f5f7; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <article class="seo">
        <h1>PaperTik</h1>
        <p>A TikTok-style feed of computer science papers. It needs JavaScript to run.</p>
        <p><a href="https://github.com/hgminh95/papertok">Source code on GitHub</a></p>
      </article>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
